name: CI

on:
  push:
  pull_request:

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 for ModDevGradle asset tasks
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Java 25 for Minecraft 26.1.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run GameTests
        run: ./gradlew build runGameTestServer -Dorg.gradle.java.installations.paths="${{ steps.java21.outputs.path }}"
